[tool.pytest.ini_options]
# The repository root on sys.path, so `import owl_mind` works without an
# editable install.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# `live` is deselected by default so the suite stays free and offline
# (ISSUE-002 FR8). Opt in with: pytest -m live
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: makes a real Anthropic API call; costs money; opt in with -m live",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Stubs declare signatures whose arguments are deliberately unused.
"owl_mind/**/*.py" = ["B027"]
