[tool.pytest.ini_options]
# The repository root on sys.path, so `import owl_mind` works without an
# editable install.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Stubs declare signatures whose arguments are deliberately unused.
"owl_mind/**/*.py" = ["B027"]
